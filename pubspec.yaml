name: flutter_by_sajid
description: Weko Pro - A Flutter mobile application.

publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  flutter_bloc: ^9.1.1
  awesome_dio_interceptor: ^1.2.0
  async: ^2.11.0
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.1.1
  json_annotation: ^4.12.0
  flutter_easyloading: ^3.0.5
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  dio: ^5.7.0
  get_storage: ^2.1.1
  permission_handler: ^12.0.1
  logger: ^2.4.0
  get_it: ^9.2.1
  auto_route: ^11.1.0
  cached_network_image: ^3.4.1
  dotted_border: ^3.1.0
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.3
  firebase_core: ^4.0.0
  firebase_remote_config: ^6.0.0
  url_launcher: ^6.3.1
  awesome_notifications: ^0.11.0
  firebase_messaging: ^16.0.0
  flutter_rating_bar: ^4.0.1
  flutter_html: ^3.0.0
  country_code_picker: ^3.1.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  collection: ^1.18.0
  webview_flutter: ^4.9.0
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  flutter_keyboard_visibility: ^6.0.0
  keyboard_actions: ^4.2.0
  network_cache_interceptor: ^2.3.5
  fast_cached_network_image: ^1.3.3+5
  http: ^1.6.0
  flutter_native_splash: ^2.4.7
  nested: ^1.0.0
  encrypt: ^5.0.1
  firebase_auth:
  google_sign_in:
  step_progress: ^2.7.1
  otp_pin_field: ^1.4.1
  flutter_sticky_header: ^0.8.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.12.0
  flutter_gen_runner: ^5.14.1
  json_serializable: ^6.14.0
  auto_route_generator: ^10.5.0
  freezed: ^3.2.5


flutter_gen:
  integrations:
    flutter_svg: true

flutter:
  default-flavor: stage
  uses-material-design: true

  assets:
    - assets/png/
    - assets/svgs/
    - assets/json/
    - assets/language/
    - assets/webp/

  fonts:
    - family: inter
      fonts:
        - asset: fonts/Inter-Thin-BETA.otf
          weight: 100
        - asset: fonts/Inter-ExtraLight-BETA.otf
          weight: 200
        - asset: fonts/Inter-Light-BETA.otf
          weight: 300
        - asset: fonts/Inter-Regular.otf
          weight: 400
        - asset: fonts/Inter-Medium.otf
          weight: 500
        - asset: fonts/Inter-SemiBold.otf
          weight: 600
        - asset: fonts/Inter-Bold.otf
          weight: 700
        - asset: fonts/Inter-ExtraBold.otf
          weight: 800
        - asset: fonts/Inter-Black.otf
          weight: 900
