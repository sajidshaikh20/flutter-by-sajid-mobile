name: flutter_by_sajid
description: FlutterBySajid - A Flutter project by Sajid.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+01

environment:
  sdk: '>=3.5.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_bloc: ^9.0.0
  awesome_dio_interceptor: ^1.2.0 # Network process logger (Logger interceptor), platform: All.
  async: ^2.11.0 #for making future function
  device_info_plus: ^11.5.0 # Get current device information from within the Flutter application.
  package_info_plus: ^8.0.2 # Get current device information from within the Flutter application.
  connectivity_plus: ^6.0.5 # To Check internet connectivity, platform: Alql.
  json_annotation: ^4.9.0 # Used by [json_serializable] for converting models class and json, platform: All.
  flutter_easyloading: ^3.0.5 # To show loader, platform: All.
  intl: ^0.20.2 # Date and time, platform: All.
  flutter_svg: ^2.0.10+1 # To load svg files in imageview, platform: All.
  dio: ^5.7.0   # Network Service (Api Calling), platform: All.
  get_storage: ^2.1.1 # To Store Key-value pair data (SharedPreference), platform: All.
  permission_handler: ^12.0.1 # To request permissions, platform: Android, IOS, Windows.
  logger: ^2.4.0 # print some text in console in different styles, platform: All.
  get_it: ^8.2.0
  auto_route: ^9.2.2 #A declarative routing solution,
  cached_network_image: ^3.4.1 #To load and cache network images.
  dotted_border: ^3.1.0
  equatable: ^2.0.5
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  path_provider: ^2.1.3
  firebase_core: ^4.0.0
  firebase_remote_config: ^6.0.0
  cloud_firestore: ^6.0.0 # Project Aether — Geo-Raid atomic counter & Engagement Chat.
  url_launcher: ^6.3.1 #to launch phone dialer in flutter
  awesome_notifications: ^0.10.1
  firebase_messaging: ^16.0.0
  flutter_rating_bar: ^4.0.1
  timeline_tile: ^2.0.0
  google_maps_flutter: ^2.10.0
  flutter_html: ^3.0.0-beta.2
  share_plus: ^11.1.0
  google_places_flutter: ^2.0.9
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  country_code_picker: ^3.1.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  collection: ^1.18.0 # Collections and utilities functions and classes related to collections, platforms: All
  flutter_widget_from_html: ^0.17.0
  photo_view: ^0.15.0
  webview_flutter: ^4.9.0
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  google_sign_in: ^6.1.6 #google sign in Platform Android IOS MACOS WEB
  flutter_facebook_auth: ^7.1.2
  sign_in_with_apple: ^7.0.1
  jwt_decoder: ^2.0.1
  app_tracking_transparency: ^2.0.6+1
  flutter_keyboard_visibility: ^6.0.0
  keyboard_actions: ^4.2.0
  badges: ^3.1.2
  network_cache_interceptor: ^2.3.5
  fast_cached_network_image: ^1.3.3+5
  otp_pin_field:
    path: ./dependency/otp_pin_field-1.3.2
  sensors_plus: ^6.1.2
  http: 1.2.2
  flutter_native_splash: ^2.4.6
  nested: ^1.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.0.0 # Project Aether — Concurrency harness for RaidService.

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0 # To perform lint operations
  build_runner: ^2.4.9 # To Run build runner command
  flutter_gen_runner: ^5.11.0
  json_serializable: ^6.7.1 # Generate model class using json
  auto_route_generator: ^9.0.0
  encrypt: ^5.0.1


dependency_overrides:
  dart_style: ^3.0.0
  http: 1.2.2

flutter_gen:
  integrations:
    flutter_svg: true
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/png/
    - assets/svgs/
    - assets/json/
    - assets/language/


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: inter
      fonts:
        - asset: fonts/Inter-Thin-BETA.otf
          weight: 100
        - asset: fonts/Inter-ExtraLight-BETA.otf
          weight: 200
        - asset: fonts/Inter-Light-BETA.otf
          weight: 300
        - asset: fonts/Inter-Regular.otf
          weight: 400
        - asset: fonts/Inter-Medium.otf
          weight: 500
        - asset: fonts/Inter-SemiBold.otf
          weight: 600
        - asset: fonts/Inter-Bold.otf
          weight: 700
        - asset: fonts/Inter-ExtraBold.otf
          weight: 800
        - asset: fonts/Inter-Black.otf
          weight: 900


  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
